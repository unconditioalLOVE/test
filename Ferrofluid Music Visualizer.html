<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferrofluid Music Visualizer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#050506;overflow:hidden;color:#9a9aa3;font:13px -apple-system,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:30px;background:rgba(20,20,24,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.06)}
button,label.b{all:unset;box-sizing:border-box;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#aaa;background:rgba(255,255,255,.05)}
button.on{color:#fff;background:rgba(120,160,255,.28)}
button:active,label.b:active{background:rgba(255,255,255,.14)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
input[type=range]{width:110px;accent-color:#8aa4ff}
#set{display:none;flex-direction:column;gap:8px;padding:12px 16px;border-radius:18px}
#set.open{display:flex}
#set div{display:flex;align-items:center;justify-content:space-between;gap:14px}
#set button.t{width:auto;border-radius:16px;padding:0 14px;height:32px}
#st{height:16px;font-size:12px;opacity:.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui">
<div id="st"></div>
<div class="bar" id="set"><div>変形の強さ<input id="str" type="range" min="0.3" max="2" step="0.05" value="1"></div><div>アニメーション<button class="t" id="rst">リセット</button></div></div>
<div class="bar">
<button id="mic" aria-label="マイク"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<label class="b" aria-label="音楽"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><input id="file" type="file" accept="audio/*" hidden></label>
<input id="sens" type="range" min="0.3" max="3" step="0.05" value="1.2" aria-label="感度">
<button id="gear" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
</div></div>
<audio id="au" loop playsinline></audio>
<script>
const N=24,cv=document.getElementById('c'),$=id=>document.getElementById(id);
const gl=cv.getContext('webgl',{antialias:false,alpha:false});
const P=new Float32Array(N*3);
for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),t=i*2.399963;P.set([Math.cos(t)*r,y,Math.sin(t)*r],i*3)}
const S=new Float32Array(N),V=new Float32Array(N),W=Array.from({length:N},()=>.55+.45*Math.random());
let sens=1.2,strength=1,tch={x:0,y:0,z:1,w:0,down:false,hold:0,target:0};
let ctx,an,data,srcMic,srcFile,stream,mode='demo',sm={b:0,m:0,t:0,a:0};
const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;
uniform vec2 uRes;uniform float uT;uniform float uS[24];uniform vec3 uP[24];uniform vec4 uTch;uniform vec3 uA;uniform mat3 uR;
float H(vec3 d,vec3 v){float s=0.;
for(int i=0;i<24;i++){float c=dot(d,uP[i]);float a=sqrt(max(0.,2.-2.*c));s+=uS[i]*exp(-a*6.5);}
float tc=dot(v,uTch.xyz);s+=uTch.w*exp(-sqrt(max(0.,2.-2.*tc))*7.);
s+=.016*sin(d.x*4.+uT*1.1)*sin(d.y*5.-uT*.9)*sin(d.z*4.+uT*.7)+uA.x*.05*sin(d.x*3.+d.y*2.+uT*1.6)*sin(d.z*3.-uT*1.3);
float f=sin(d.x*20.+uT*6.)*sin(d.y*19.-uT*5.)*sin(d.z*21.+uT*4.);s+=uA.y*.035*max(f,0.);return s;}
float M(vec3 p){float r=length(p);vec3 v=p/r;return(r-(.72+H(uR*v,v)))*.55;}
vec3 Nm(vec3 p){vec2 e=vec2(1.,-1.)*.004;return normalize(e.xyy*M(p+e.xyy)+e.yyx*M(p+e.yyx)+e.yxy*M(p+e.yxy)+e.xxx*M(p+e.xxx));}
vec3 env(vec3 d){vec3 c=vec3(.01,.012,.016)+vec3(.02,.025,.035)*(d.y*.5+.5);
c+=vec3(1.,.97,.92)*2.4*smoothstep(.9,.97,dot(d,normalize(vec3(-.5,.7,.6))));
c+=vec3(.7,.85,1.)*1.3*smoothstep(.93,.985,dot(d,normalize(vec3(.8,.2,.5))));
c+=vec3(1.)*.4*smoothstep(.96,.99,dot(d,normalize(vec3(0.,-.3,.95))));
c+=vec3(.5,.6,.9)*.7*smoothstep(.85,.95,dot(d,normalize(vec3(0.,.3,-1.))));return c;}
void main(){vec2 uv=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y)*2.;
vec3 ro=vec3(0.,0.,5.),rd=normalize(vec3(uv,-2.6));
vec3 col=vec3(.012)*(1.-.45*length(uv));
float b=dot(ro,rd),c=dot(ro,ro)-2.25,disc=b*b-c;
if(disc>0.){float t0=-b-sqrt(disc);vec3 pe=ro+rd*t0,ne=pe/1.5;
vec3 ri=refract(rd,ne,1./1.2);
col=vec3(.012)+vec3(.012)*(ri.y*.5+.5);
float bb=dot(pe,ri),dd=bb*bb-1.96;
if(dd>0.){float t=max(0.,-bb-sqrt(dd));vec3 p;bool hit=false;
for(int i=0;i<64;i++){p=pe+ri*t;float d=M(p);if(d<.0015){hit=true;break;}t+=d;if(t>4.)break;}
if(hit){vec3 n=Nm(p);vec3 rr=reflect(ri,n);float F=.05+.95*pow(1.-max(dot(-ri,n),0.),4.);
col=vec3(.003,.004,.007)+env(rr)*(F*1.25+.06);}}
float Fg=.03+.97*pow(1.-max(dot(-rd,ne),0.),5.);
col+=env(reflect(rd,ne))*Fg*1.1;}
col=pow(col/(1.+col*.6),vec3(.4545));gl_FragColor=vec4(col,1.);}`;
let U={},use2d=false,c2;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return gl.getShaderParameter(o,gl.COMPILE_STATUS)?o:null}
if(gl){const pr=gl.createProgram(),v=sh(gl.VERTEX_SHADER,VS),f=sh(gl.FRAGMENT_SHADER,FS);
if(!v||!f)use2d=true;else{gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
['uRes','uT','uS[0]','uP[0]','uTch','uA','uR'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));gl.uniform3fv(U['uP[0]'],P)}}
else use2d=true;
if(use2d){const n=cv.cloneNode();cv.replaceWith(n);c2=n.getContext('2d')}
const cvs=()=>document.querySelector('canvas');
function resize(){const d=Math.min(devicePixelRatio||1,matchMedia('(pointer:coarse)').matches?1.5:2),k=cvs();k.width=innerWidth*d;k.height=innerHeight*d;if(!use2d)gl.viewport(0,0,k.width,k.height)}
addEventListener('resize',resize);resize();
function st(m){$('st').textContent=m}
async function ensure(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.6;data=new Uint8Array(an.frequencyBinCount)}if(ctx.state==='suspended')await ctx.resume()}
function stopMic(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(srcMic){srcMic.disconnect();srcMic=null}$('mic').classList.remove('on')}
$('mic').onclick=async()=>{if(stream){stopMic();mode='demo';st('');return}
try{await ensure();$('au').pause();stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
srcMic=ctx.createMediaStreamSource(stream);if(srcFile)srcFile.disconnect();srcMic.connect(an);mode='mic';$('mic').classList.add('on');st('マイク入力中')}catch(e){st('マイクを使用できません');stopMic()}};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;stopMic();await ensure();const a=$('au');a.src=URL.createObjectURL(f);
if(!srcFile){srcFile=ctx.createMediaElementSource(a)}srcFile.disconnect();srcFile.connect(an);an.connect(ctx.destination);
try{await a.play();mode='file';st('♪ '+f.name.slice(0,28))}catch(_){st('再生できません')}};
$('sens').oninput=e=>sens=+e.target.value;$('str').oninput=e=>strength=+e.target.value;
$('gear').onclick=()=>{$('set').classList.toggle('open');$('gear').classList.toggle('on')};
$('rst').onclick=()=>{S.fill(0);V.fill(0);sm={b:0,m:0,t:0,a:0};tch.w=0;tch.hold=0;strength=1;$('str').value=1;sens=1.2;$('sens').value=1.2};
function pt(e){const k=cvs(),r=k.getBoundingClientRect(),m=Math.min(r.width,r.height)/2;
let x=(e.clientX-r.left-r.width/2)/m/.42,y=-(e.clientY-r.top-r.height/2)/m/.42,l=Math.hypot(x,y);if(l>.98){x/=l/.98;y/=l/.98}
tch.x=x;tch.y=y;tch.z=Math.sqrt(Math.max(0,1-x*x-y*y))}
addEventListener('pointerdown',e=>{if(e.target.closest('#ui'))return;tch.down=true;tch.hold=0;pt(e)});
addEventListener('pointermove',e=>{if(tch.down)pt(e)});
addEventListener('pointerup',()=>tch.down=false);addEventListener('pointercancel',()=>tch.down=false);
function bands(t){let b,m,tr,a;
if(an&&mode!=='demo'&&(mode==='mic'||!$('au').paused)){an.getByteFrequencyData(data);
const av=(i,j)=>{let s=0;for(let k=i;k<j;k++)s+=data[k];return s/(j-i)/255};
b=av(1,7);m=av(7,60);tr=av(60,260);a=av(1,260)*1.6;
b=Math.pow(b,1.4)*1.6;m=Math.pow(m,1.3)*2.2;tr=Math.pow(tr,1.2)*3}
else{const k=Math.pow(Math.max(0,Math.sin(t*2.1)),8);b=.15+.55*k+.1*Math.sin(t*.6);m=.18+.15*Math.sin(t*.9)*Math.sin(t*.37);tr=.1+.2*Math.pow(Math.max(0,Math.sin(t*5.3)),4)*Math.max(0,Math.sin(t*.4));a=.2+.3*k;
const q=Math.sin(t*.13);if(q>.5){b*=.2;m*=.3;tr*=.2;a*=.2}}
return[b*sens,m*sens,tr*sens,a*sens]}
let last=performance.now(),T=0;
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
const[b,m,tr,a]=bands(T);const sa=(o,n,up,dn)=>o+(n-o)*(1-Math.exp(-(n>o?up:dn)*dt));
sm.b=sa(sm.b,b,30,2.2);sm.m=sa(sm.m,m,14,2.5);sm.t=sa(sm.t,tr,40,5);sm.a=sa(sm.a,a,20,2);
const cl=x=>Math.min(1,x);
for(let i=0;i<N;i++){const ty=i%4,ph=.5+.5*Math.sin(T*(.5+W[i]*.6)+i*2.1);let tg;
if(ty===0)tg=.05+.55*cl(sm.b)*(.5+.5*ph)*W[i];else if(ty===3)tg=.02+.24*cl(sm.t)*ph;else tg=.03+.3*cl(sm.m)*(.4+.6*ph)*W[i];
tg=Math.min(.55,tg*(.55+.45*cl(sm.a+.4))*strength);
const k=tg>S[i]?70:12,c=tg>S[i]?9:7;V[i]+=((tg-S[i])*k-V[i]*c)*dt;S[i]=Math.max(0,S[i]+V[i]*dt)}
tch.hold=tch.down?Math.min(1,tch.hold+dt*.9):0;const tt=tch.down?.2+.4*tch.hold:0;tch.w+=(tt*strength-tch.w)*(1-Math.exp(-(tch.down?14:4)*dt));
if(use2d)draw2d();else{
const ay=T*.12,ax=Math.sin(T*.07)*.3,cy=Math.cos(ay),sy=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);
const R=new Float32Array([cy,sx*sy,-cx*sy,0,cx,sx,sy,-sx*cy,cx*cy]);
const k=cvs();gl.uniform2f(U.uRes,k.width,k.height);gl.uniform1f(U.uT,T);gl.uniform1fv(U['uS[0]'],S);
gl.uniform4f(U.uTch,tch.x,tch.y,tch.z,tch.w);gl.uniform3f(U.uA,Math.min(1,sm.m),Math.min(1,sm.t),Math.min(1,sm.a));
gl.uniformMatrix3fv(U.uR,false,R);gl.drawArrays(gl.TRIANGLES,0,3)}
requestAnimationFrame(frame)}
function draw2d(){const k=cvs(),w=k.width,h=k.height,r=Math.min(w,h)*.3;c2.fillStyle='#060607';c2.fillRect(0,0,w,h);
c2.beginPath();for(let a=0;a<=360;a+=2){const t=a*Math.PI/180;let s=0;for(let i=0;i<N;i+=1){const ang=i/N*6.283,d=Math.abs(Math.atan2(Math.sin(t-ang),Math.cos(t-ang)));s+=S[i]*Math.exp(-d*7)}
const rr=r*(1+s*1.2),x=w/2+Math.cos(t)*rr,y=h/2+Math.sin(t)*rr;a?c2.lineTo(x,y):c2.moveTo(x,y)}
c2.fillStyle='#000';c2.fill();c2.strokeStyle='rgba(255,255,255,.2)';c2.lineWidth=2;c2.stroke();
c2.beginPath();c2.arc(w/2,h/2,r*2,0,6.283);c2.strokeStyle='rgba(255,255,255,.1)';c2.stroke()}
requestAnimationFrame(frame);
</script></body></html>
