<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THE DISTANT</title>
<style>
:root { color-scheme: dark; --ground: #0a1017; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--ground); }
</style>
<canvas id="c" aria-label="霧の平原と海の遠景"></canvas>
<script>
(() => {
'use strict';

/* ---------- shaders ---------- */
const VS = 'attribute vec2 a;varying vec2 vUv;void main(){vUv=a*.5+.5;gl_Position=vec4(a,0.,1.);}';
const HDR = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\nvarying vec2 vUv;\n' +
'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}\n' +
'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}\n' +
'float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}\n';

const FS_SCENE = HDR + `
uniform vec2 uRes; uniform float uT,uZoom; uniform vec2 uWin;
uniform float uDusk,uFog,uCloud,uRain,uFrost,uGlint; uniform vec2 uGlow;
uniform sampler2D uFig; uniform vec2 uFigPx;
const float H=.62; const float S=.50;
float fogAt(vec2 uv,float asp,float t){
  float base=uFog*(.22+.78*smoothstep(0.,.55,uv.y));
  float drift=fbm(vec2(uv.x*asp*2.2-t*.006,uv.y*7.+t*.002));
  float low=smoothstep(.12,.62,fbm(vec2(uv.x*asp*1.1-t*.004+3.,uv.y*3.+t*.0015)));
  float f=base*(.5+.75*drift)+uFog*.38*low*smoothstep(.62,.28,uv.y);
  f*=1.-.72*smoothstep(H,H+.25,uv.y);
  return clamp(f,0.,.95);
}
void main(){
  float asp=uRes.x/uRes.y; float t=uT;
  vec2 uv=uWin+vUv/uZoom;
  vec3 skyTop=mix(vec3(.040,.062,.105),vec3(.135,.175,.265),uDusk);
  vec3 skyHor=mix(vec3(.18,.29,.35),vec3(.575,.565,.625),uDusk);
  float grey=clamp(uCloud*.35+uRain*.35,0.,1.);
  skyTop=mix(skyTop,vec3(dot(skyTop,vec3(.33)))+vec3(.01,.015,.025),grey*.5);
  /* sky */
  float sy=clamp((uv.y-H)/(1.-H),0.,1.);
  vec3 sky=mix(skyHor,skyTop,pow(sy,.55));
  float glow=exp(-(pow((uv.x-.64)*asp*1.6,2.)+pow((uv.y-.76)*2.6,2.)));
  sky+=vec3(.11,.14,.18)*glow*(1.-uDusk*.6)*(1.-uCloud*.55);
  sky+=vec3(.14,.11,.12)*uDusk*exp(-(pow((uv.x-.36)*asp*1.2,2.)+pow((uv.y-H)*7.,2.)));
  float cn=fbm(vec2(uv.x*asp*1.2+t*.004,uv.y*3.2-t*.0012));
  float cov=mix(.62,.28,uCloud);
  float cl=smoothstep(cov,cov+.3,cn);
  vec3 cloudCol=mix(skyTop*1.5,skyHor*.82,.55);
  sky=mix(sky,cloudCol,cl*(.22+.6*uCloud)*smoothstep(H,H+.08,uv.y));
  /* sea */
  float sd=clamp((uv.y-S)/(H-S),0.,1.);
  vec3 seaNear=mix(vec3(.07,.13,.17),vec3(.30,.34,.40),uDusk);
  vec3 sea=mix(seaNear,skyHor*.96,pow(sd,.7));
  float wv=fbm(vec2(uv.x*asp*5.+t*.02,uv.y*140.-t*.06+fbm(vec2(uv.x*asp*3.,t*.01))*2.));
  sea+=(wv-.5)*.055*(1.-sd*.55)*(.7+uRain*.6);
  float gl2=exp(-pow((uv.x-.64)*asp*4.5,2.));
  sea+=gl2*(wv-.42)*(.10+uGlint*.16)*(1.-uCloud*.6)*(1.-uDusk*.7)*(1.-sd*.5);
  sea+=uGlint*.018*(1.-sd);
  float shore=exp(-pow((uv.y-S-.006-.003*sin(uv.x*asp*9.+t*.12))*150.,2.));
  sea+=shore*.05*(.6+.4*vn(vec2(uv.x*asp*14.,t*.05)));
  /* plain */
  float z=1./(S+.04-min(uv.y,S));
  vec2 wp=vec2((uv.x-.5)*asp*z,z);
  float pn=fbm(wp*vec2(.9,1.4)+vec2(0.,t*.0005));
  vec3 plain=vec3(.075,.100,.125)*(.82+.36*pn);
  plain*=1.+uDusk*.45;
  plain*=mix(.55,1.35,smoothstep(0.,S,uv.y));
  float fr=uFrost*smoothstep(.0,.4,pn+.15);
  float ice=smoothstep(.5,.85,fbm(wp*vec2(6.,8.)));
  plain+=fr*ice*vec3(.09,.115,.14)*(.5+.5*(1.-uDusk*.5));
  plain=mix(plain,plain*1.22+vec3(.012,.018,.026),uFrost*.5*pn);
  float sp=step(.988,h21(floor(wp*vec2(70.,90.))));
  plain+=uFrost*sp*vec3(.16,.2,.25)*(.6+.4*sin(t*.7+h21(floor(wp*60.))*40.));
  /* compose */
  vec3 col=plain;
  col=mix(col,sea,smoothstep(S-.0015,S+.0015,uv.y));
  col=mix(col,sky,smoothstep(H-.004,H+.007,uv.y));
  col+=skyHor*.22*exp(-pow((uv.y-H)*26.,2.));
  float f=fogAt(uv,asp,t);
  vec3 fogCol=skyHor*.95+.03;
  col=mix(col,fogCol,f);
  vec2 gd=vec2((uv.x-uGlow.x)*asp*1.25,(uv.y-uGlow.y)*3.);
  float gl3=exp(-dot(gd,gd)*1.6);
  vec3 gcol=mix(vec3(.16,.37,.45),vec3(.55,.55,.60),uDusk);
  col+=gcol*gl3*(.12+.88*uFog)*(.55+.45*vn(vec2(uv.x*asp*2.+t*.01,uv.y*4.)));
  /* figures and birds (soft) */
  float rr=1.+f*1.6;
  vec2 d1=uFigPx*rr;
  vec2 s=texture2D(uFig,uv).rg*.30
    +(texture2D(uFig,uv+vec2(d1.x,0.)).rg+texture2D(uFig,uv-vec2(d1.x,0.)).rg+texture2D(uFig,uv+vec2(0.,d1.y)).rg+texture2D(uFig,uv-vec2(0.,d1.y)).rg)*.1
    +(texture2D(uFig,uv+d1).rg+texture2D(uFig,uv-d1).rg+texture2D(uFig,uv+vec2(d1.x,-d1.y)).rg+texture2D(uFig,uv+vec2(-d1.x,d1.y)).rg)*.075;
  vec3 figCol=mix(vec3(.018,.030,.052),vec3(.06,.07,.10),uDusk);
  col=mix(col,figCol,s.r*(1.-f*.5)*.95);
  col=mix(col,figCol,s.g*.5*(1.-f*.5));
  /* rain veil */
  float streak=pow(vn(vec2(uv.x*asp*160.,uv.y*5.+t*7.)),6.);
  col+=uRain*streak*.018;
  col=mix(col,fogCol,uRain*.08);
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;

const FS_FINAL = HDR + `
uniform sampler2D uScene,uCond,uDrops; uniform vec2 uRes; uniform float uT,uAmb;
void main(){
  float asp=uRes.x/uRes.y; vec2 uv=vUv;
  vec4 d=texture2D(uDrops,uv);
  vec2 off=(d.rg*2.-1.)*.045*d.a; off.x/=asp;
  vec2 q=uv+off;
  float c=texture2D(uCond,uv).r; c*=1.-d.a*.85;
  float R=.0016+.012*c;
  vec2 k1=vec2(R/asp,R), k2=k1*2.;
  vec3 col=texture2D(uScene,q).rgb*.25;
  for(int i=0;i<6;i++){
    float a=float(i)*1.0472+.3;
    vec2 dir=vec2(cos(a),sin(a));
    col+=texture2D(uScene,q+dir*k1).rgb*(.5/6.);
    col+=texture2D(uScene,q+dir*k2).rgb*(.25/6.);
  }
  float lum=dot(col,vec3(.3,.5,.2));
  vec3 glass=mix(vec3(.30,.37,.45),vec3(.64,.67,.73),uAmb)*(.8+.5*lum);
  col=mix(col,glass,c*.62);
  col=mix(col,vec3(lum),c*.3);
  col+=d.a*(.035+(d.g-.5)*.10);
  col=mix(vec3(dot(col,vec3(.33))),col,.9);
  col=col*.96+.012;
  col+=(h21(uv*uRes+fract(uT)*91.)-.5)*.026;
  col*=1.-.50*pow(length((uv-.5)*vec2(1.,.9))*1.25,2.4);
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const approach = (v, t, dt, tau) => v + (t - v) * (1 - Math.exp(-dt / tau));
const pickW = (list) => {
  let s = 0; for (const o of list) s += o.w;
  let r = Math.random() * s;
  for (const o of list) { r -= o.w; if (r <= 0) return o; }
  return list[list.length - 1];
};
let asp = 16 / 9;

/* ---------- world: weather, light, sea ---------- */
const W = { dusk: 0, fog: .55, cloud: .45, rain: 0, frost: 0, glint: 0 };
const T = { dusk: 0, fog: .55, cloud: .45, rain: 0, frost: 0 };
const TAU = { dusk: 70, fog: 60, cloud: 80, rain: 25, frost: 90 };
let wTimer = rand(40, 100), evTimer = rand(120, 240), evLeft = 0, evName = '';
let glTimer = rand(200, 500), glT = -1, glDur = 100, glAmp = 1;
const hash = (location.hash || '').slice(1).split('-').filter(Boolean);
const forced = hash.length > 0;

function startEvent() {
  const e = pickW([{ n: 'rain', w: 4 }, { n: 'dusk', w: 2.5 }, { n: 'frost', w: 1.5 }]);
  evName = e.n;
  if (e.n === 'frost' && (W.dusk > .2 || W.rain > .1)) evName = 'rain';
  if (evName === 'rain') { T.rain = rand(.55, 1); T.fog = Math.max(T.fog, .6); T.cloud = Math.max(T.cloud, .75); evLeft = rand(240, 600); }
  else if (evName === 'dusk') { T.dusk = 1; evLeft = rand(300, 540); }
  else { T.frost = 1; T.fog = Math.min(T.fog, .55); T.cloud = Math.min(T.cloud, .5); evLeft = rand(300, 540); }
}
function endEvent() { T.rain = 0; T.dusk = 0; T.frost = 0; evName = ''; evTimer = rand(240, 600); }

function applyHash() {
  for (const k of hash) {
    if (k === 'rain') { T.rain = W.rain = .9; T.fog = W.fog = .65; T.cloud = W.cloud = .85; }
    if (k === 'dusk') { T.dusk = W.dusk = 1; }
    if (k === 'frost') { T.frost = W.frost = 1; T.fog = W.fog = .35; T.cloud = W.cloud = .3; }
    if (k === 'clear') { T.fog = W.fog = .3; T.cloud = W.cloud = .2; }
    if (k === 'thick') { T.fog = W.fog = .85; }
  }
}
applyHash();

let glowX = .5, wClock = 0;
function stepWorld(dt) {
  wClock += dt; glowX = .5 + .17 * Math.sin(wClock * .006) + .05 * Math.sin(wClock * .017 + 2);
  if (!forced) {
    wTimer -= dt;
    if (wTimer <= 0) { wTimer = rand(50, 140); if (T.rain < .1) T.fog = rand(.3, .82); if (evName !== 'rain') T.cloud = rand(.2, .95); }
    if (evLeft > 0) { evLeft -= dt; if (evLeft <= 0) endEvent(); }
    else { evTimer -= dt; if (evTimer <= 0) startEvent(); }
  }
  for (const k in TAU) W[k] = approach(W[k], T[k], dt, TAU[k]);
  glTimer -= dt;
  if (glTimer <= 0 && glT < 0) { glT = 0; glDur = rand(70, 130); glAmp = rand(.5, 1); glTimer = rand(300, 800); }
  if (glT >= 0) { glT += dt; W.glint = Math.sin(Math.PI * clamp(glT / glDur, 0, 1)) * glAmp; if (glT > glDur) { glT = -1; W.glint = 0; } }
}

/* ---------- people ---------- */
const L = { th: .245, sh: .245, tor: .30, ua: .165, fa: .155, neck: .04, hr: .066 };
if (hash.includes('dbg')) window.__p = () => people;
const POSES = {
  stand:     { tor: 0,  head: 0,   ua: 4,   fa: 8,  ua2: -3,  fa2: 6,  th: 0,   sh: 0,    th2: 0,   sh2: 0 },
  shift:     { tor: 2,  head: 3,   ua: 6,   fa: 12, ua2: -4,  fa2: 5,  th: 3,   sh: -3,   th2: -7,  sh2: -14 },
  lookDown:  { tor: 8,  head: 32,  ua: 10,  fa: 20, ua2: 4,   fa2: 14, th: 0,   sh: 0,    th2: 0,   sh2: 0 },
  lookUp:    { tor: -3, head: -34, ua: 3,   fa: 6,  ua2: -4,  fa2: 5,  th: 0,   sh: 0,    th2: 0,   sh2: 0 },
  sitHug:    { tor: 22, head: 8,   ua: 38,  fa: 85, ua2: 30,  fa2: 80, th: 118, sh: -148, th2: 120, sh2: -150 },
  sitDown:   { tor: 52, head: 38,  ua: 55,  fa: 95, ua2: 50,  fa2: 95, th: 120, sh: -148, th2: 122, sh2: -150 },
  sitUp:     { tor: 12, head: -8,  ua: 38,  fa: 85, ua2: 30,  fa2: 80, th: 118, sh: -148, th2: 120, sh2: -150 },
  sitStretch:{ tor: -8, head: 4,   ua: -28, fa: 6,  ua2: 12,  fa2: 40, th: 88,  sh: 4,    th2: 86,  sh2: 6 },
  riseLean:  { tor: 55, head: 18,  ua: 28,  fa: 6,  ua2: 22,  fa2: 8,  th: 112, sh: -140, th2: 114, sh2: -142 },
  crouch:    { tor: 50, head: 14,  ua: 32,  fa: 10, ua2: 28,  fa2: 12, th: 95,  sh: -120, th2: 97,  sh2: -122 },
  standLean: { tor: 22, head: 8,   ua: 14,  fa: 12, ua2: 10,  fa2: 10, th: 20,  sh: -20,  th2: 22,  sh2: -22 },
  sitLean:   { tor: -28,head: -8,  ua: -50, fa: 10, ua2: -45, fa2: 8,  th: 105, sh: -100, th2: 100, sh2: -95 }
};
const KEYS = Object.keys(POSES.stand);
const yOf = (d) => .49 - .30 * d;
const hOf = (d) => .05 + .025 * d;

class Person {
  constructor(o) {
    this.x = o.x; this.d = o.d; this.mode = 'stand'; this.after = 'stand';
    this.pose = Object.assign({}, POSES.stand); this.tgt = Object.assign({}, POSES.stand);
    this.f = 0; this.ft = 0; this.walk = 0; this.walkT = 0; this.ph = Math.random() * 6;
    this.timer = rand(20, 60); this.dest = null; this.alpha = o.alpha == null ? 1 : o.alpha;
    this.alphaT = 1; this.leaving = false; this.gone = false; this.aware = Math.random() < .6;
    this.seq = []; this.tauP = 2.2; this.pendingLeave = false; this.force = null; this.demo = false; this.other = null; this.lastDir = 1; this.life = o.life || 0; this.dirty = true;
    if (o.walkTo) this.goto(o.walkTo.x, o.walkTo.d, 'stand');
  }
  setPose(n) { Object.assign(this.tgt, POSES[n]); }
  startSeq(to) {
    const hold = this.demo ? 6 : null;
    this.mode = to;
    this.seq = to === 'stand'
      ? [{ p: 'riseLean', t: 4 }, { p: 'crouch', t: 4 }, { p: 'standLean', t: 3.5 }, { p: 'stand', t: hold || rand(25, 90) }]
      : [{ p: 'standLean', t: 3.5 }, { p: 'crouch', t: 4 }, { p: 'riseLean', t: 4 }, { p: 'sitHug', t: hold || rand(40, 160) }];
    this.tauP = 1.3; this.takeSeq();
  }
  takeSeq() { const s = this.seq.shift(); this.setPose(s.p); this.timer = s.t; if (!this.seq.length) this.tauP = 2.2; }
  glanceDir() {
    const o = this.other;
    if (o && this.aware && !o.gone && Math.random() < .75) return o.x >= this.x ? 1 : -1;
    return Math.random() < .5 ? 1 : -1;
  }
  goto(x, d, after) { this.dest = { x: clamp(x, .06, .94), d: clamp(d, 0, .85) }; this.mode = 'walk'; this.after = after; this.walkT = 1; this.timer = 1e9; this.setPose('stand'); }
  leave() {
    if (this.pendingLeave) return;
    if (this.mode === 'sit' || this.seq.length) { this.pendingLeave = true; if (this.mode === 'sit') this.startSeq('stand'); return; }
    this.goto(this.x + rand(-.2, .2), -.1, 'stand'); this.leaving = true;
  }
  next() {
    if (this.seq.length) { this.takeSeq(); return; }
    if (this.pendingLeave) { this.pendingLeave = false; this.leave(); return; }
    if (this.mode === 'walk') { this.walkT = 0; this.ft = 0; this.timer = rand(25, 90); if (this.after === 'sit') this.startSeq('sit'); else { this.mode = 'stand'; this.setPose('stand'); } return; }
    this.ft = 0;
    if (this.mode === 'stand') {
      const a = this.force || pickW([
        { n: 'hold', w: 5 }, { n: 'shift', w: 2 }, { n: 'down', w: 2 }, { n: 'up', w: 1.5 }, { n: 'glance', w: 1.8 },
        { n: 'sit', w: 1.4 }, { n: 'step', w: 1.4 }, { n: 'back', w: .6 }, { n: 'roam', w: .9 }, { n: 'away', w: this.other ? .15 : .35 }
      ]).n;
      this.force = null; this.setPose('stand'); this.timer = this.demo ? 6 : rand(30, 120);
      if (a === 'shift') { this.setPose('shift'); this.timer = rand(10, 25); }
      else if (a === 'down') { this.setPose('lookDown'); this.timer = rand(8, 20); }
      else if (a === 'up') { this.setPose('lookUp'); this.timer = rand(8, 18); }
      else if (a === 'glance') { this.ft = this.glanceDir(); this.timer = rand(10, 35); }
      else if (a === 'sit') { this.startSeq('sit'); if (this.demo) this.force = 'stand'; }
      else if (a === 'step') { this.lastDir = Math.random() < .5 ? 1 : -1; this.goto(this.x + this.lastDir * rand(.02, .06), this.d + rand(-.03, .03), 'stand'); }
      else if (a === 'back') { this.goto(this.x - this.lastDir * rand(.02, .05), this.d, 'stand'); }
      else if (a === 'roam') { this.goto(glowX + rand(-.3, .3), rand(.25, .55), Math.random() < .6 ? 'sit' : 'stand'); }
      else if (a === 'away' && !this.leaving) { this.leave(); }
    } else {
      const a = this.force || pickW([
        { n: 'hold', w: 4 }, { n: 'face', w: 2 }, { n: 'up', w: 2 }, { n: 'stretch', w: 1.2 }, { n: 'lean', w: 1.2 },
        { n: 'glance', w: 1.2 }, { n: 'stand', w: 1.2 }
      ]).n;
      this.force = null; this.setPose('sitHug'); this.timer = this.demo ? 6 : rand(40, 200);
      if (a === 'face') { this.setPose('sitDown'); this.timer = rand(20, 90); }
      else if (a === 'up') { this.setPose('sitUp'); this.timer = rand(15, 60); }
      else if (a === 'stretch') { this.setPose('sitStretch'); this.timer = rand(30, 120); }
      else if (a === 'lean') { this.setPose('sitLean'); this.timer = rand(30, 120); }
      else if (a === 'glance') { this.setPose('sitUp'); this.ft = this.glanceDir(); this.timer = rand(12, 40); }
      else if (a === 'stand') { this.startSeq('stand'); if (this.demo) this.force = 'sit'; }
    }
  }
  update(dt) {
    this.timer -= dt; if (this.timer <= 0) this.next();
    if (this.mode === 'walk' && this.dest) {
      const dxu = (this.dest.x - this.x) * asp, dyu = yOf(this.dest.d) - yOf(this.d);
      const dist = Math.hypot(dxu, dyu);
      const step = .4 * hOf(this.d) * .42 * dt;
      if (dist < 1e-4 || step >= dist) { this.x = this.dest.x; this.d = this.dest.d; if (this.leaving) { this.gone = true; } else this.next(); }
      else {
        const fr = step / dist; this.x += (this.dest.x - this.x) * fr; this.d += (this.dest.d - this.d) * fr;
        this.ft = dxu / Math.hypot(dxu, dyu * 2.2);
        if (Math.abs(dxu) > .001) this.lastDir = dxu > 0 ? 1 : -1;
      }
      if (this.leaving) this.alphaT = clamp(this.d / .22, 0, 1);
    }
    let mv = 0;
    for (const k of KEYS) { const n = approach(this.pose[k], this.tgt[k], dt, this.tauP); mv = Math.max(mv, Math.abs(n - this.pose[k])); this.pose[k] = n; }
    this.f = approach(this.f, this.ft, dt, 1.4);
    this.walk = approach(this.walk, this.walkT, dt, 1.2);
    this.ph += dt * 2 * Math.PI * .4 * this.walk;
    this.alpha = approach(this.alpha, this.alphaT, dt, 12);
    this.life += dt;
  }
  draw(ctx, CW, CH, t) {
    if (this.alpha < .01) return;
    const P = Object.assign({}, this.pose), w = this.walk, ph = this.ph, r = (a) => a * Math.PI / 180;
    if (w > .01) {
      const c1 = Math.max(0, Math.cos(ph)), c2 = Math.max(0, Math.cos(ph + Math.PI));
      P.th += w * 26 * Math.sin(ph); P.sh += -w * 35 * c1;
      P.th2 += -w * 26 * Math.sin(ph); P.sh2 += -w * 35 * c2;
      P.ua += -w * 14 * Math.sin(ph); P.ua2 += w * 14 * Math.sin(ph);
    }
    const breath = Math.sin(t * .6 + this.x * 9) * .6;
    P.tor += breath * .5;
    const af = Math.abs(this.f), sgn = this.f < 0 ? -1 : 1, s = Math.max(.28, af) * sgn, lat = 1 - af;
    const pt = (a, len) => [Math.sin(r(a)) * len, -Math.cos(r(a)) * len];
    const leg = (th, sh) => { const k = pt(th, L.th), f2 = pt(th + sh, L.sh); return [k, [k[0] + f2[0], k[1] + f2[1]]]; };
    const l1 = leg(P.th, P.sh), l2 = leg(P.th2, P.sh2);
    const hy = -Math.min(l1[1][1], l2[1][1]);
    const hip = [0, hy];
    for (const q of [l1, l2]) { q[0][1] += hy; q[1][1] += hy; }
    const sh = [hip[0] + Math.sin(r(P.tor)) * L.tor, hip[1] + Math.cos(r(P.tor)) * L.tor];

  A.sw += d / (9 + 3 * Math.sin(t * .05));
  const sw = .5 + .5 * Math.sin(A.sw * 6.283);
  A.wave.gain.setTargetAtTime(.022 + .05 * sw * sw, now, .8);
  A.hush.gain.setTargetAtTime(.012 * Math.pow(sw, 3) * (1 - W.rain * .5), now, .6);
}
document.addEventListener('visibilitychange', () => { if (!A) return; if (document.hidden) A.ctx.suspend(); else A.ctx.resume(); });

/* ---------- main loop ---------- */
let last = 0, tClock = 0, accC = 0, upC = 1, upD = 1, upF = 1;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (ts - last) / 1000 || .016); last = ts; tClock += dt;
  stepWorld(dt); stepPeople(dt, tClock);
  accC += dt; if (accC > .12) { stepCond(accC); stepDrops(accC); accC = 0; }
  stepAudio(dt, tClock);
  zC = approach(zC, zT, dt, .12); sxC = approach(sxC, sxT, dt, .12); syC = approach(syC, syT, dt, .12);
  if (!GLOK) return;
  const sx = clamp(sxC, 0, 1 - 1 / zC), sy = clamp(syC, 0, 1 - 1 / zC);
  upF += dt; if (upF > .05) { upF = 0; drawPeople(fctx, CW, CH, tClock); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texFig); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, fig); }
  upC += dt; if (condDirty && upC > .07) { upC = 0; condDirty = false; for (let i = 0; i < cond.length; i++) cu8[i] = Math.min(255, cond[i] * 255); gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texCond); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1); gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, gw, gh, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, cu8); }
  upD += dt; if (dropUp && upD > .2) { upD = 0; dropUp = false; gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texDrops); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, dgw, dgh, 0, gl.RGBA, gl.UNSIGNED_BYTE, dbuf); }
  /* pass 1 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, SW, SH);
  gl.useProgram(P1.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texFig);
  const u1 = (n, ...v) => gl['uniform' + v.length + 'f'](P1.u(n), ...v);
  gl.uniform1i(P1.u('uFig'), 0); u1('uRes', SW, SH); u1('uT', tClock); u1('uZoom', zC); u1('uWin', sx, sy);
  u1('uDusk', W.dusk); u1('uFog', W.fog); u1('uCloud', W.cloud); u1('uRain', W.rain); u1('uFrost', W.frost); u1('uGlint', W.glint); u1('uFigPx', 1 / CW, 1 / CH); u1('uGlow', glowX, .40);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  /* pass 2 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height);
  gl.useProgram(P2.p);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texScene);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texCond);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texDrops);
  gl.uniform1i(P2.u('uScene'), 1); gl.uniform1i(P2.u('uCond'), 2); gl.uniform1i(P2.u('uDrops'), 3);
  gl.uniform2f(P2.u('uRes'), cv.width, cv.height); gl.uniform1f(P2.u('uT'), tClock); gl.uniform1f(P2.u('uAmb'), clamp(.15 + .75 * W.dusk, 0, 1));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
resize();
requestAnimationFrame(frame);
})();
